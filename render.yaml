services:
  # -------------------------------------------------------------
  # Backend: CodeSense AI Express API Server (Web Service)
  # -------------------------------------------------------------
  - type: web
    name: codesense-ai-server
    runtime: node
    rootDir: codesense-ai/server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"

  # -------------------------------------------------------------
  # Frontend: CodeSense AI React Client (Static Site)
  # -------------------------------------------------------------
  - type: static
    name: codesense-ai-client
    rootDir: codesense-ai/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: codesense-ai-server
          property: host
